<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Hardik Verma</title>
  <meta name="theme-color" content="#f6efe3" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/fraunces-normal-400-900-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: Fraunces; font-weight: 400 900; font-display: swap; src: url(/fonts/fraunces-normal-400-900-latin.woff2) format('woff2'); }
    @font-face { font-family: Figtree; font-weight: 400 800; font-display: swap; src: url(/fonts/figtree-normal-400-800-latin.woff2) format('woff2'); }
    @font-face { font-family: Caveat; font-weight: 500 700; font-display: swap; src: url(/fonts/caveat-normal-500-700-latin.woff2) format('woff2'); }
    :root { --paper: #f6efe3; --ink: #211c33; --ink-2: #5d566f; --sun: #ffc94a; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1d1c21; --ink: #f6efe3; --ink-2: #b9b4c8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--paper); color: var(--ink); font: 17px/1.55 Figtree, system-ui, sans-serif; }
    main { max-width: 34rem; }
    .code { font: 600 28px/1 Caveat, cursive; color: var(--ink-2); margin: 0; }
    h1 { margin: 8px 0 14px; font: 700 clamp(36px, 8vw, 64px)/1.02 Fraunces, Georgia, serif; letter-spacing: -0.02em; }
    p { margin: 0 0 26px; color: var(--ink-2); }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--sun); color: #211c33; border: 2px solid #211c33; box-shadow: 4px 4px 0 #211c33; text-decoration: none; font-weight: 700; }
    a:hover { transform: translate(-1px, -1px); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { a:hover { transform: none; } }
  </style>
  <script>if (/^\/Portfolio(\/|$)/.test(location.pathname)) location.replace('/' + location.hash);</script>
</head>
<body>
  <main>
    <p class="code">404 · wrong turn</p>
    <h1>That page is not in town.</h1>
    <p>The link may be old or mistyped. The portfolio is one page, and everything is on it.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
